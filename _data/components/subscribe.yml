name: Subscribe
include: gg/subscribe.html
figma: Subscribe
summary: The newsletter sign-up, on a dark band, with reCAPTCHA’s attribution line. Needs newsletter.js and float-label.js on the page.
formats: [web]
decisions: [D-030, D-033, D-051]
preview: site
preview_bare: true
preview_height: 120
params:
  - name: heading
    type: text
    required: false
    default: Email newsletter
    source: request
  - name: sitekey
    type: text
    required: false
    default: site.recaptcha_sitekey
    source: site
    notes: The site’s reCAPTCHA site key.
examples:
  - title: Sign-up
    params: { heading: Email newsletter }
