name: Card
include: gg/card.html
figma: Card
summary: A linked card on a color, for the service pages; two to a row from 768px.
formats: [web]
decisions: [D-030, D-033, D-051]
preview: site
preview_height: 420
params:
  - name: color
    type: enum
    values: [green, red, gold, purple]
    required: false
    source: fixed
    notes: Leave out for the pale green card.
  - name: title
    type: text
    required: true
    source: request
  - name: blurb
    type: text
    required: true
    source: claims
    notes: What the page offers, in claims.md wording.
  - name: link
    type: text
    required: true
    source: request
    notes: The link’s label.
  - name: dest
    type: url
    required: true
    source: site
    notes: A path on the site, without the leading slash.
examples:
  - title: Pale green
    params: { title: Title, blurb: Blurb, link: Link, dest: "#" }
  - title: Purple
    params: { color: purple, title: Title, blurb: Blurb, link: Link, dest: "#" }
  - title: Gold
    params: { color: gold, title: Title, blurb: Blurb, link: Link, dest: "#" }
  - title: Red
    params: { color: red, title: Title, blurb: Blurb, link: Link, dest: "#" }
