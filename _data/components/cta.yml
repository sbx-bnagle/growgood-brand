name: CTA block
include: gg/cta.html
figma: CTA block
summary: The call to action at the foot of a service page.
formats: [web]
decisions: [D-033, D-051]
preview: site
preview_height: 360
params:
  - name: heading
    type: text
    required: false
    default: Ready to get started?
    source: request
  - name: body
    type: text
    required: false
    default: The site’s ‘we’re flexible’ line
    source: request
  - name: button
    type: text
    required: false
    default: Get in touch
    source: request
    notes: The button’s label.
  - name: href
    type: url
    required: false
    default: "#contact"
    source: site
examples:
  - title: With every part
    params: { heading: Heading, body: Body, button: Button label, href: "#" }
