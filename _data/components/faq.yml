name: FAQ
include: gg/faq.html
figma: null
summary: The FAQ items from one set of the site’s FAQ data. Needs assets/js/faq.js on the page.
formats: [web]
decisions: [D-033, D-051]
preview: site
preview_height: 300
params:
  - name: set
    type: text
    required: true
    source: site
    notes: A key in the site’s _data/faqs.yml. Answers there are claims (claims.md).
  - name: heading
    type: text
    required: false
    default: FAQ
    source: request
data: [faqs]
examples:
  - title: A sample set
    params: { set: sample, heading: Heading }
