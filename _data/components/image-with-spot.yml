name: Image with spot
include: gg/image-with-spot.html
figma: Image with spot
summary: A photograph with an animated spot laid over it.
formats: [web, flyer, postcard, social]
decisions: [D-024, D-038]
params:
  - name: image
    type: asset
    required: false
    source: assets
    notes: An approved photo or illustration row. Empty shows a placeholder until Phase 5.
  - name: alt
    type: text
    required: false
    source: assets
    notes: The register’s alt text, never new wording.
  - name: spot
    type: asset
    required: false
    source: assets
  - name: position
    type: enum
    values: [top-left, bottom-right]
    default: top-left
    source: fixed
examples:
  - title: Placeholder, until the asset library is filled
    params: { position: top-left }
