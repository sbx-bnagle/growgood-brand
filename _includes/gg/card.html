{%- comment -%}
  A linked card on a color. Contract: _data/components/card.yml
  The site's markup and styles (D-051): gg/site/template/components/component--card.
{%- endcomment -%}
<div class="card {{ include.color }}">
  <a href="{{ site.url }}/{{ include.dest }}">
    <h2>{{ include.title }}</h2>
    <p>{{ include.blurb }}</p>
    <span class="gg_button">{{ include.link }}</span>
  </a>
</div>
