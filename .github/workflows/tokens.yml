name: Tokens

# Runs on every change to the tokens or the token tools. A Figma export arrives as a pull
# request that changes tokens/*.json only: this job checks it against the brand rules,
# rebuilds tokens/build, the theme's token Sass and the playbook pages, and commits them to the
# same pull request.

on:
  pull_request:
    paths: ['tokens/**', 'tools/**', 'mcp/**', 'request/**', 'request-app/**', 'functions/**', 'figma-plugin/**', 'tests/**', '_data/components/**', 'package.json', 'package-lock.json', '.github/workflows/tokens.yml']
  push:
    branches: [main]
    paths: ['tokens/**', 'tools/**', 'mcp/**', 'request/**', 'request-app/**', 'functions/**', 'figma-plugin/**', 'tests/**', '_data/components/**', 'package.json', 'package-lock.json', '.github/workflows/tokens.yml']

permissions:
  contents: write

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tokens against the brand rules
        run: npm run tokens:check

      - name: Build token outputs and the playbook pages
        run: |
          npm run tokens:build
          npm run playbook:build

      - name: Build and test the Figma plugin
        run: npm test

      - name: Commit rebuilt outputs to the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- tokens/build figma-plugin/dist _sass/gg playbook; then echo "Build outputs are up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tokens/build figma-plugin/dist _sass/gg playbook
          git commit -m "Rebuild token outputs, the Figma plugin bundle and the playbook pages"
          git push

      - name: Fail if main has stale outputs
        if: github.event_name == 'push'
        run: git diff --exit-code -- tokens/build figma-plugin/dist _sass/gg playbook
