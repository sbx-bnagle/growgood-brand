name: Playbook

# Checks every theme include against its contract (D-042) and builds the playbook site (D-044)
# on every pull request and every push to main, then deploys it to Cloudflare Pages (D-052):
# main to production, a pull request from this repo to a preview address of its own.
# The deploy waits for the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playbook:
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the components against their contracts
        run: npm run components:check

      - name: Check the asset library against its manifest
        run: npm run assets:check

      # Report only: every check warns until launch (D-054, O-20). Findings go to the run summary.
      - name: Lint the brand files' copy
        env:
          LINT_COPY_TITLE: Copy in the brand files
        run: npm run checks:copy

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build the playbook
        run: bundle exec jekyll build

      - name: Deploy to Cloudflare Pages
        if: env.CAN_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=growgood-playbook --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
